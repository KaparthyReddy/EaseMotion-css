<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michelson Interferometer Fringe | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="michelson-demo-container">
    <header class="michelson-demo-header">
      <h1>Michelson Interferometer Fringe</h1>
      <p>Phase-shifting optical interference pattern drifting across a laser detector screen.</p>
    </header>

    <section class="ease-michelson-interferometer-fringe">
      <div class="ease-michelson-interferometer-fringe__housing">
        <div class="ease-michelson-interferometer-fringe__bezel">
          <div class="ease-michelson-interferometer-fringe__face">
            <div class="ease-michelson-interferometer-fringe__motion" aria-hidden="true">
              <span class="ease-michelson-interferometer-fringe__a"></span>
              <span class="ease-michelson-interferometer-fringe__b"></span>
              <span class="ease-michelson-interferometer-fringe__c"></span>
              <span class="ease-michelson-interferometer-fringe__d"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <p class="michelson-demo-hint">💡 Demonstrates CSS radial interference gradients, phase shift motion, and beam splitter gleam.</p>
  </main>
</body>
</html>
