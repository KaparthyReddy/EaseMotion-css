<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crookes Radiometer Vane | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="radiometer-demo-container">
    <header class="radiometer-demo-header">
      <h1>Crookes Radiometer Vane</h1>
      <p>Crookes radiometer bulb with light-driven rotating vanes.</p>
    </header>

    <section class="ease-crookes-radiometer-vane">
      <div class="ease-crookes-radiometer-vane__housing">
        <div class="ease-crookes-radiometer-vane__bezel">
          <div class="ease-crookes-radiometer-vane__face">
            <div class="ease-crookes-radiometer-vane__motion" aria-hidden="true">
              <span class="ease-crookes-radiometer-vane__a"></span>
              <span class="ease-crookes-radiometer-vane__b"></span>
              <span class="ease-crookes-radiometer-vane__c"></span>
              <span class="ease-crookes-radiometer-vane__d"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <p class="radiometer-demo-hint">💡 Glass bulb silhouette with alternating dark and silver rotating vanes.</p>
  </main>
</body>
</html>
