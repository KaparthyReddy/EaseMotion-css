<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Travel Insurance Card | EaseMotion CSS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <article class="insurance-card" tabindex="0" aria-label="Global Voyager Shield Travel Insurance Plan Summary">
    <header class="card-header">
      <div class="plan-info">
        <span class="plan-badge">
          <span class="badge-dot" aria-hidden="true"></span>
          <span>Active Policy</span>
        </span>
        <h1 class="plan-title">Global Voyager Shield</h1>
      </div>
      <div class="plan-price">
        <div class="price-val">$49</div>
        <div class="price-sub">per traveler / trip</div>
      </div>
    </header>

    <div class="card-divider" aria-hidden="true"></div>

    <section aria-label="Coverage Breakdown">
      <h2 class="coverage-section-title">Coverage Summary</h2>
      <ul class="coverage-grid">
        <li class="coverage-item">
          <svg class="coverage-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
          </svg>
          <div class="coverage-details">
            <span class="coverage-name">Medical Emergency</span>
            <span class="coverage-limit">$500,000</span>
          </div>
        </li>

        <li class="coverage-item">
          <svg class="coverage-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <div class="coverage-details">
            <span class="coverage-name">Trip Cancellation</span>
            <span class="coverage-limit">Up to $10,000</span>
          </div>
        </li>

        <li class="coverage-item">
          <svg class="coverage-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <div class="coverage-details">
            <span class="coverage-name">Baggage Loss</span>
            <span class="coverage-limit">$2,500</span>
          </div>
        </li>

        <li class="coverage-item">
          <svg class="coverage-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <div class="coverage-details">
            <span class="coverage-name">Travel Delay</span>
            <span class="coverage-limit">$1,000</span>
          </div>
        </li>
      </ul>
    </section>

    <div class="card-divider" aria-hidden="true"></div>

    <footer class="card-footer">
      <div class="policy-meta">
        <span>Worldwide Coverage • 24/7 Hotline</span>
      </div>
      <a href="#view-policy" class="cta-btn">
        <span>View Details</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </footer>
  </article>
</body>
</html>
